name: Linting

on:
  push:
    branches:
      - main
      - beta
      - release
      - "hotfix*"
  pull_request:
    branches:
      - main
      - beta
      - release
      - "hotfix*"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting-path-filter:
    name: Linting path filter
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.filter.outputs.all }}
      ts-files: ${{ steps.filter.outputs.ts-files }}
      js-files: ${{ steps.filter.outputs.js-files }}
      github-scripts: ${{ steps.filter.outputs.github-scripts }}
      local-scripts: ${{ steps.filter.outputs.local-scripts }}
      desktop-files: ${{ steps.filter.outputs.desktop-files }}
      website-files: ${{ steps.filter.outputs.website-files }}
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          sparse-checkout: |
            .github/lint-filters.yml

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: .github/lint-filters.yml

  run-linters:
    name: Run all linters
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: linting-path-filter

    steps:
      - name: Check out Git repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          submodules: "recursive"

      - uses: ./.github/actions/setup-deps
        if: |
          needs.linting-path-filter.outputs.all == 'true' ||
          needs.linting-path-filter.outputs.ts-files == 'true' ||
          needs.linting-path-filter.outputs.js-files == 'true' ||
          needs.linting-path-filter.outputs.github-scripts == 'true' ||
          needs.linting-path-filter.outputs.local-scripts == 'true' ||
          needs.linting-path-filter.outputs.desktop-files == 'true' ||
          needs.linting-path-filter.outputs.website-files == 'true'

      # Lint files with Biome-Lint - https://biomejs.dev/linter/
      - name: Lint with Biome
        run: pnpm biome:ci
        if: >-
          ${{ !cancelled() &&
            (
              needs.linting-path-filter.outputs.all == 'true' ||
              needs.linting-path-filter.outputs.ts-files == 'true' ||
              needs.linting-path-filter.outputs.js-files == 'true' ||
              needs.linting-path-filter.outputs.desktop-files == 'true' ||
              needs.linting-path-filter.outputs.website-files == 'true'
            ) }}

      # Validate dependencies with dependency-cruiser - https://github.com/sverweij/dependency-cruiser
      - name: Run Dependency Cruiser
        run: pnpm depcruise
        if: >-
          ${{ !cancelled() &&
            (
              needs.linting-path-filter.outputs.all == 'true' ||
              needs.linting-path-filter.outputs.ts-files == 'true' ||
              needs.linting-path-filter.outputs.js-files == 'true' ||
              needs.linting-path-filter.outputs.github-scripts == 'true' ||
              needs.linting-path-filter.outputs.local-scripts == 'true'
            ) }}

      # Validate types with tsc - https://www.typescriptlang.org/docs/handbook/compiler-options.html#using-the-cli
      - name: Run Typecheck (Main Repo + Scripts)
        run: pnpm typecheck:main
        id: typecheck-main
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.ts-files == 'true' || needs.linting-path-filter.outputs.local-scripts == 'true') }}

      - name: Run Typecheck (Github Scripts)
        run: pnpm typecheck:github
        id: typecheck-github
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.github-scripts == 'true') }}

      - name: Run Typecheck (JS files)
        run: pnpm typecheck:js
        id: typecheck-js
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.js-files == 'true' || needs.linting-path-filter.outputs.desktop-files == 'true') }}

      - name: Run Desktop Protocol Tests
        run: pnpm test:desktop
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.desktop-files == 'true') }}

      - name: Test Keagan Edition landing site
        run: pnpm site:test
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.website-files == 'true') }}

      - name: Build Keagan Edition landing site
        run: pnpm site:build
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.website-files == 'true') }}

      - name: Build Desktop App
        run: pnpm build:app
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.ts-files == 'true' || needs.linting-path-filter.outputs.desktop-files == 'true') }}

      - name: Run Type Tests
        run: pnpm test:types
        id: type-tests
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.ts-files == 'true') }}

      - name: Validate PowerShell packaging scripts
        shell: pwsh
        run: |
          $parseFailed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            foreach ($parseError in $errors) {
              Write-Error "$($_.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              $parseFailed = $true
            }
          }

          if ($parseFailed) {
            throw "PowerShell packaging script validation failed."
          }
        if: ${{ !cancelled() && (needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.desktop-files == 'true') }}

      - name: Check for REUSE compliance
        id: reuse-lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
        if: ${{ !cancelled() }}

  desktop-package:
    name: Assemble Windows desktop app
    timeout-minutes: 20
    runs-on: windows-latest
    needs: linting-path-filter
    if: ${{ needs.linting-path-filter.outputs.all == 'true' || needs.linting-path-filter.outputs.desktop-files == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          submodules: "recursive"

      - uses: ./.github/actions/setup-deps

      - name: Build and assemble unpacked Windows app
        shell: pwsh
        run: ./scripts/package-exe.ps1 -UnpackedOnly
