# files that can affect the processing of all code files and/or the lint workflow itself
all:
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - ".nvmrc"
  - ".dependency-cruiser.cjs"
  - ".ls-lint.yml"
  - "biome.jsonc"
  - ".github/lint-filters.yml"
  - ".github/workflows/linting.yml"
  - ".github/workflows/publish-keagan-windows.yml"

# main repo TS files
ts-files:
  - "{src,test,plugins}/**/*.ts"
  - "global.d.ts"
  - "vite.config.ts"
  - "vitest.config.ts"
  - "tsconfig.json"
  - ".env*"

# main repo JS files
js-files:
  - ".dependency-cruiser.cjs"
  - "electron/**/*.cjs"
  - "scripts/**/*.cjs"
  - "website/**/*.js"
  - "website/**/*.cjs"
  - "website/**/*.mjs"
  - "typedoc.config.js"
  - "plugins/typedoc/**/*.js"
  - "jsconfig.json"

# files/scripts used by github workflows
github-scripts:
  - ".github/scripts/**/*.mts"
  - ".github/scripts/tsconfig.json"

# scripts run locally and related files
local-scripts:
  - "scripts/**/*.ts"
  - "scripts/**/*.ps1"
  - "scripts/**/*.cjs"
  - "scripts/tsconfig.json"
  - "tsconfig.json"
  - ".env*"

# Electron entrypoints and Windows packaging configuration
desktop-files:
  - ".env.app"
  - "electron/**/*.cjs"
  - "electron-builder.json"
  - "scripts/**/*.ps1"
  - "scripts/**/*.cjs"
  - "src/api/**/*.ts"
  - "src/main.ts"
  - "src/utils/cookies.ts"
  - "vite.config.ts"

# Static Keagan Edition landing site
website-files:
  - "website/**/*"
  - "package.json"
  - "pnpm-lock.yaml"
  - ".github/workflows/linting.yml"
